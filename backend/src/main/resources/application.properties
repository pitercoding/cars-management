spring.application.name=backend
spring.profiles.active=dev
# Schema is owned by Flyway now (see db/migration); Hibernate only
# validates that entity mappings match what Flyway created.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Lets Flyway take over a database that already has these tables
# (from the pre-Flyway ddl-auto=update days) without trying to
# recreate them; on a fresh/empty database it runs V1 for real.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: cars_management
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # BackendApplicationTests boots the full Spring context, so it needs a
      # real database. The prod profile is env-var driven and secret-free,
      # so it's reused here against the throwaway MySQL service above.
      - name: Build and test
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: prod
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/cars_management
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root
          JWT_SECRET: RwxTTbx7oXdX855ylJlPsuwBdQuXpqs+Txfa1Q9QAbI=
        run: ./mvnw -B clean verify

  frontend:
    name: Frontend (build + test)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Unit tests
        working-directory: frontend
        run: npx ng test --watch=false --browsers=ChromeHeadless

      # Known finding from AUDIT.md: 46 vulnerabilities as of this writing,
      # mostly from being on Angular 20.x. Reported but non-blocking until
      # the dependency upgrade (AUDIT.md item 9) lands, so CI stays green
      # in the meantime instead of being red from day one.
      - name: Dependency audit (report only)
        working-directory: frontend
        run: npm audit --audit-level=high || true
